name = "rando"
main = "worker/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "rando"
database_id = "b61c9d6b-8ddd-4670-8a1e-2a42f3cdd92b"

[[migrations]]
tag = "v2"
deleted_classes = ["AnalyticsDO"]

[observability]
enabled = true

[observability.logs]
enabled = true

[vars]
DOMAIN_NAME = "rando.brine.dev"
